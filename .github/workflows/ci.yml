name: CI

on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!/*.md"
      - "!/docs/**"
      - "!/LICENSE-*.txt"

  pull_request:
    paths:
      - "**"
      - "!/*.md"
      - "!/docs/**"
      - "!/LICENSE-*.txt"

  workflow_dispatch:

jobs:
  ci:
    name: CI
    needs: [smoke, test, docs, rustfmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Done
        run: exit 0

  test:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]

    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.rust != 'stable' }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2.9.2

      - shell: bash
        run: cargo test

  docs:
    name: Docs
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check Documentation
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check Formatting
        shell: bash
        run: cargo fmt --all -- --check

  clippy:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - shell: bash
        run: cargo clippy --all-targets -- -D warnings

  smoke:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Default Features
        shell: bash
        run: cargo check --all-targets
